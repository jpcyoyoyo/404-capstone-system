# /etc/mosquitto/conf.d/greenhouse.conf
# Integration Plan §9.4: 1883 for the controller services and nodes, 9001 WebSocket for the app.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/greenhouse.passwd
acl_file /etc/mosquitto/greenhouse.acl

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Keep retained state (latest readings, actuator states, controller status) across broker restarts.
persistence true

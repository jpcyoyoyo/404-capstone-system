[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenhouse-controller"
version = "0.1.0"
description = "Raspberry Pi controller for the IoT-Enabled Smart Greenhouse (404 Brains Not Found)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "cryptography>=42",
  "paho-mqtt>=2.0",
  "pyyaml>=6",
  "argon2-cffi>=23",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
pi = [
  "gpiozero>=2.0",
  "lgpio>=0.2",
  "pyserial>=3.5",
  "adafruit-blinka>=8",
  "adafruit-circuitpython-ads1x15>=2.2",
  "adafruit-circuitpython-pca9685>=3.4",
]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4"]

[project.scripts]
greenhouse = "greenhouse.__main__:main"

[tool.setuptools.packages.find]
include = ["greenhouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
